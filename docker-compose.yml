services:
  statdb:
    image: qbsoon/stat-db:latest
    container_name: statdb
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      STATDB_HOST: 0.0.0.0
      STATDB_PORT: 5000
      STATDB_DATA_DIR: /app/data
      STATDB_LANGUAGE: en
      # Auth — uncomment / set to enable:
      # STATDB_PASSWORD: changeme
      # STATDB_API_TOKEN: changeme
      # STATDB_SECRET_KEY: changeme
      STATDB_SNAPSHOT_ENABLED: "0"
      STATDB_SNAPSHOT_INTERVAL: "86400"
      STATDB_SNAPSHOT_RETENTION: "7"
    volumes:
      - ./data:/app/data
